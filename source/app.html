<title>Physique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column iOS-style shell. Tab roots open with a large title, pushed screens get a sticky blurred nav bar, a fixed tab bar sits at the bottom. Push / Pull / Legs each own a color that runs through every screen. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#EFF1F5; --surface-3:#E4E7EE;
  --line:rgba(17,22,38,.08); --line-2:rgba(17,22,38,.14);
  --text:#0D1016; --text-2:#586072; --text-3:#959BAA;
  --push:#F2552C; --pull:#2E6AF0; --legs:#0E9F76; --rest:#8A90A2; --brand:#F2552C;
  --good:#10995F; --warn:#C98200; --bad:#DC3F3A;
  --navbar:rgba(243,244,248,.84); --tabbar:rgba(251,251,253,.86); --sheet:#FFFFFF; --overlay:rgba(10,12,18,.36);
  --btn:#0D1016; --on-btn:#FFFFFF; --on-c:#FFFFFF;
  --shadow:0 1px 2px rgba(15,20,35,.04),0 4px 18px rgba(15,20,35,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
  --tabh:58px; --r-xl:26px; --r-lg:20px; --r-md:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08090D; --surface:#14161C; --surface-2:#1D2029; --surface-3:#282C37;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
    --text:#F2F4F8; --text-2:#A1A8B7; --text-3:#646B7B;
    --push:#FF6A42; --pull:#4F87FF; --legs:#21C592; --rest:#7D8496; --brand:#FF6A42;
    --good:#2CC784; --warn:#F2A928; --bad:#FF5F57;
    --navbar:rgba(8,9,13,.82); --tabbar:rgba(18,20,26,.84); --sheet:#16181F; --overlay:rgba(0,0,0,.58);
    --btn:#F2F4F8; --on-btn:#0B0D12; --on-c:#FFFFFF;
    --shadow:0 0 0 1px rgba(255,255,255,.035);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08090D; --surface:#14161C; --surface-2:#1D2029; --surface-3:#282C37;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --text:#F2F4F8; --text-2:#A1A8B7; --text-3:#646B7B;
  --push:#FF6A42; --pull:#4F87FF; --legs:#21C592; --rest:#7D8496; --brand:#FF6A42;
  --good:#2CC784; --warn:#F2A928; --bad:#FF5F57;
  --navbar:rgba(8,9,13,.82); --tabbar:rgba(18,20,26,.84); --sheet:#16181F; --overlay:rgba(0,0,0,.58);
  --btn:#F2F4F8; --on-btn:#0B0D12; --on-c:#FFFFFF;
  --shadow:0 0 0 1px rgba(255,255,255,.035);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.42 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navbar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
h1,h2,h3,h4,p{margin:0}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ico.fill{fill:currentColor;stroke:none}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.faint{color:var(--text-3)}

#app{overflow-x:clip;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 36px)}
#view{display:flex;flex-direction:column;gap:14px}
#view.slide{animation:slideIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:.4;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Large title */
.lt{padding-top:12px;display:flex;flex-direction:column;gap:0}
.lt-row{display:flex;align-items:center;justify-content:space-between;min-height:38px;gap:12px}
.eyebrow{font-size:12.5px;font-weight:650;color:var(--text-2);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:6px}
.lt h1{font-family:var(--font-display);font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.lt-actions{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--text);box-shadow:var(--shadow);flex:none}
.icon-btn .ico{width:20px;height:20px}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm .ico{width:18px;height:18px}
.live{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* Nav bar for pushed screens */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;background:var(--navbar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);min-height:50px}
.nav-back{display:flex;align-items:center;gap:2px;color:var(--brand);font-weight:600;font-size:16px;padding:6px 4px;min-width:0}
.nav-back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-back .ico{width:24px;height:24px;stroke-width:2.4}
.nav-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;text-align:center}
.nav-right{justify-self:end;display:flex;gap:6px;align-items:center}
.nav-link{color:var(--brand);font-weight:650;font-size:16px;padding:6px 6px}

/* Cards and lists */
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-t{font-size:17px;font-weight:720;letter-spacing:-.01em}
.card-s{font-size:13px;color:var(--text-2)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;gap:12px}
.sec h2{font-family:var(--font-display);font-size:21px;font-weight:780;letter-spacing:-.015em}
.sec .link{color:var(--brand);font-weight:650;font-size:14.5px}
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;position:relative;min-height:60px}
.row + .row::before{content:"";position:absolute;left:62px;right:0;top:0;border-top:.5px solid var(--line)}
.row.plain + .row.plain::before{left:14px}
.row-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--rest)) 15%,transparent);color:var(--c,var(--rest));flex:none}
.row-ic .ico{width:19px;height:19px;stroke-width:2.2}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-t{font-weight:640;font-size:15.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-t.wrap{white-space:normal}
.row-s{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{display:flex;align-items:center;gap:8px;color:var(--text-3);flex:none;font-size:14px}
.row-end .ico{width:18px;height:18px}
.row-v{font-family:var(--font-num);font-weight:700;color:var(--text);font-size:15px;font-variant-numeric:tabular-nums}
.chev{color:var(--text-3)}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2);letter-spacing:.02em;white-space:nowrap}
.tag .ico{width:12px;height:12px;stroke-width:2.6}
.tag.c{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tags{display:flex;gap:6px;flex-wrap:wrap}

.btn{min-height:46px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15.5px;padding:0 16px;text-align:center;line-height:1.15}
.btn .ico{width:19px;height:19px;stroke-width:2.3}
.btn-primary{background:var(--btn);color:var(--on-btn)}
.btn-c{background:var(--c);color:var(--on-c)}
.btn-soft{background:color-mix(in srgb,var(--c,var(--brand)) 13%,transparent);color:var(--c,var(--brand))}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-danger{background:color-mix(in srgb,var(--bad) 11%,transparent);color:var(--bad)}
.btn-block{width:100%}
.btn-lg{min-height:54px;font-size:16.5px;border-radius:16px}
.btn:active,.row:active,.exc-main:active,.wd:active,.cal-d:active,.daycard:active{opacity:.7}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Hero */
.hero{--c:var(--push);position:relative;overflow:hidden;border-radius:var(--r-xl);padding:18px;color:#fff;background:radial-gradient(110% 80% at 100% 0%,color-mix(in srgb,var(--c) 70%,#fff) 0%,transparent 60%),linear-gradient(155deg,var(--c) 0%,color-mix(in srgb,var(--c) 52%,#05070B) 100%);box-shadow:0 16px 36px -18px color-mix(in srgb,var(--c) 80%,transparent);display:flex;flex-direction:column;gap:10px;isolation:isolate}
.hero.rest{--c:var(--rest)}
.hero-art{position:absolute;right:-28px;bottom:-30px;width:190px;height:190px;opacity:.14;z-index:-1;stroke-width:1.5}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-badge{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.95}
.hero-badge i{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.hero-badge .ico{width:17px;height:17px;stroke-width:2.4}
.hero-title{font-family:var(--font-display);font-size:42px;line-height:1;font-weight:850;letter-spacing:-.03em}
.hero-meta{font-size:14.5px;font-weight:550;opacity:.92}
.hero-chips{display:flex;flex-wrap:wrap;gap:6px}
.hero-chips span{font-size:12px;font-weight:650;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.17);white-space:nowrap}
.hero-btn{margin-top:4px;min-height:50px;border-radius:15px;background:rgba(255,255,255,.96);color:color-mix(in srgb,var(--c) 78%,#000);font-weight:780;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.hero-btn .ico{width:18px;height:18px}
.hero-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.hero-bar b{display:block;height:100%;background:#fff;border-radius:999px}
.hero-stats{display:flex;gap:18px}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-family:var(--font-num);font-size:22px;font-weight:780;line-height:1.1}
.hero-stats span{font-size:12px;opacity:.85;font-weight:600}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{--c:var(--rest);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 9px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);min-width:0}
.wd .dow{font-size:11px;font-weight:750;color:var(--text-3);letter-spacing:.05em}
.wd .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.wd .dot .ico{width:15px;height:15px;stroke-width:2.6}
.wd .lbl{font-size:10.5px;font-weight:700;color:var(--text-2);white-space:nowrap}
.wd.done .dot{background:var(--c);color:var(--on-c)}
.wd.missed .dot{background:transparent;border:1.5px dashed color-mix(in srgb,var(--c) 55%,transparent)}
.wd.rest .dot{background:var(--surface-2);color:var(--text-3)}
.wd.today{box-shadow:inset 0 0 0 2px var(--c)}
.wd.today .dow{color:var(--c)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{--k:var(--brand);background:var(--surface);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;min-width:0}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stat-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--k)}
.stat-ic .ico{width:18px;height:18px;stroke-width:2.2}
.stat-v{font-family:var(--font-num);font-size:27px;font-weight:780;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat-v small{font-size:13px;font-weight:650;color:var(--text-2);margin-left:3px;letter-spacing:0}
.stat-l{font-size:12.5px;color:var(--text-2);font-weight:600}
.delta{font-size:12px;font-weight:750;font-family:var(--font-num);white-space:nowrap}
.up{color:var(--good)} .down{color:var(--bad)}

/* Rings */
.rings{display:flex;align-items:center;gap:18px}
.rings svg{flex:none}
.ring-legend{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.rl{display:flex;align-items:center;gap:10px}
.rl i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none}
.rl i .ico{width:16px;height:16px;stroke-width:2.4}
.rl b{font-family:var(--font-num);font-size:17px;font-weight:780}
.rl span{font-size:12.5px;color:var(--text-2);font-weight:600;display:block;line-height:1.2}

/* Session */
.sum{display:flex;align-items:center;gap:16px}
.sum-m{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:1}
.sum-m div{display:flex;flex-direction:column;gap:2px;min-width:0}
.sum-m b{font-family:var(--font-num);font-size:20px;font-weight:780;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.sum-m span{font-size:12px;color:var(--text-2);font-weight:600}
.exlist{display:flex;flex-direction:column;gap:10px}
.exc{--c:var(--push);display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:4px 10px 4px 4px;min-width:0}
.exc-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:10px}
.exc-body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.exc-t{font-weight:720;font-size:16px;line-height:1.25}
.exc-s{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.exc.done .exc-t{color:var(--text-2)}
.ring-in{font-family:var(--font-num);font-size:12px;font-weight:780;fill:var(--text)}
.ring-chk{color:var(--c)}

/* Exercise screen */
.exh{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.exh h1{font-family:var(--font-display);font-size:30px;line-height:1.1;font-weight:820;letter-spacing:-.025em;text-wrap:balance}
.exh p{color:var(--text-2);font-size:14.5px}
.setup{display:flex;align-items:stretch;gap:14px}
.ww{display:flex;flex-direction:column;gap:2px;justify-content:center;min-width:0}
.ww-l{font-size:11.5px;font-weight:750;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em}
.ww-v{font-family:var(--font-num);font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05;white-space:nowrap}
.ww-v small{font-size:14px;color:var(--text-2);font-weight:650;letter-spacing:0;margin-left:3px}
.pegs{display:flex;gap:8px;align-items:flex-end;flex:1;justify-content:flex-end}
.peg{display:flex;flex-direction:column;align-items:center;gap:4px;width:44px}
.peg-v{font-family:var(--font-num);font-weight:780;font-size:14px;line-height:1}
.peg-post{width:30px;height:54px;border-radius:9px;background:var(--surface-2);position:relative;overflow:hidden}
.peg-post b{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c));border-radius:9px}
.peg-l{font-size:10px;font-weight:750;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.peg.off .peg-v{color:var(--text-3)}
.divider{height:.5px;background:var(--line);margin:12px 0}
.kv{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text-2)}
.kv .ico{width:17px;height:17px;color:var(--text-3)}
.kv b{color:var(--text);font-weight:650}

.hint{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--text);font-size:13.5px;line-height:1.4}
.hint .ico{width:18px;height:18px;color:var(--warn);margin-top:1px}
.hint b{font-weight:700}
.hint button{margin-left:auto;color:var(--warn);font-weight:700;font-size:13px;flex:none;padding:2px 0 2px 6px}
.suggest{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:16px;background:color-mix(in srgb,var(--good) 12%,transparent)}
.suggest .ico{color:var(--good)}
.suggest p{flex:1;font-size:13.5px;line-height:1.35}
.suggest button{background:var(--good);color:#fff;font-weight:750;font-size:13.5px;border-radius:10px;padding:8px 12px;flex:none}

.sets{display:flex;flex-direction:column;gap:4px}
.set-h,.set{display:grid;grid-template-columns:42px minmax(0,1fr) 78px 62px 44px;gap:8px;align-items:center}
.set-h{font-size:10.5px;font-weight:750;color:var(--text-3);letter-spacing:.07em;text-transform:uppercase;padding:0 4px 4px}
.set-h span:nth-child(n+3){text-align:center}
.set{padding:5px 4px;border-radius:14px;transition:background .2s}
.set.is-done{background:color-mix(in srgb,var(--c) 10%,transparent)}
.set-n{height:34px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-num);background:var(--surface-2);color:var(--text-2);font-size:15px;line-height:1}
.set-n small{font-size:8.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.set-n.extra{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.set-n.drop{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.set-n .ico{width:14px;height:14px;stroke-width:2.8}
.set-prev{font-size:13px;color:var(--text-3);font-family:var(--font-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.set input{width:100%;height:42px;border-radius:11px;border:0;background:var(--surface-2);text-align:center;font-family:var(--font-num);font-weight:700;font-size:18px;color:var(--text);padding:0 4px;-moz-appearance:textfield;appearance:textfield;font-variant-numeric:tabular-nums}
.set input::-webkit-outer-spin-button,.set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set input::placeholder{color:var(--text-3);font-weight:600}
.set.is-done input{background:transparent}
.set.drop-row{margin-left:0}

function makeDemo() {
  const st = defaultState();
  let seed = 20241124;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const guess = {'leg-extension': 130, 'adductor': 150, 'abductor': 140};
  Object.entries(guess).forEach(([k, v]) => { st.exercises[k].weight = v; st.exercises[k].hint = null; });
  const end = today();
  for (let d = addDays(end, -77); d < end; d = addDays(d, 1)) {
    const dayId = st.schedule[dow(d)];
    if (!dayId || rnd() < 0.07) continue;
    const day = st.days[dayId];
    const weeksAgo = (dparse(end) - dparse(d)) / (7 * 864e5);
    const start = dparse(d).getTime() + (17 * 60 + Math.floor(rnd() * 80)) * 60000;
    const ss = {id: uid(), date: d, dayId, name: day.name, type: day.type, start, end: start + (50 + Math.floor(rnd() * 26)) * 60000, entries: []};
    day.items.forEach((it, k) => {
      const e = st.exercises[it.exId];
      const cur = e.weight;
      const inc = e.load === 'total' && cur >= 100 ? 10 : 5;
      const back = Math.floor((weeksAgo + (k % 3) * 0.8) / 2.7);
      const w = Math.max(inc, cur - back * inc);
      const sets = [];
      for (let i = 0; i < it.sets; i++) {
        const r = it.reps + (rnd() < 0.22 ? 1 : 0) - (i >= 2 && rnd() < 0.35 ? 1 : 0) - (i === 3 && rnd() < 0.3 ? 1 : 0);
        sets.push({w, r, done: true, t: 'work'});
      }
      if (rnd() < 0.12) sets.push({w, r: it.reps - 2, done: true, t: 'extra'});
      if (k >= day.items.length - 2 && rnd() < 0.35) sets.push({w: roundTo(w * 0.75, 5), r: it.reps + 2, done: true, t: 'drop'});
      ss.entries.push({id: uid(), exId: it.exId, name: e.name, target: {sets: it.sets, reps: it.reps}, sets});
    });
    st.sessions.push(ss);
  }
  st.exercises['prime-chest-press'].seat = 'Peg 4 (sample)';
  st.exercises['prime-chest-press'].notes = 'Sample note: handles on the middle setting, back flat on the pad.';
  return st;
}

/* Calendar */
VIEWS.calendar = () => {
  const [y, m] = ui.cal.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1), t = today();
  const startOff = (first.getDay() + 6) % 7;
  const gridStart = addDays(dstr(first), -startOff);
  const daysInMonth = new Date(y, m, 0).getDate();
  const cells = Math.ceil((startOff + daysInMonth) / 7) * 7;
  let g = ['M','T','W','T','F','S','S'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < cells; i++) {
    const d = addDays(gridStart, i), inMonth = d.slice(0, 7) === ui.cal.month;
    const ss = sessionsOn(d), doneS = ss.filter(counted), pid = S.schedule[dow(d)], plan = pid ? S.days[pid] : null;
    const type = doneS.length ? doneS[doneS.length - 1].type : plan ? plan.type : 'rest';
    let mk = '';
    if (doneS.length) mk = doneS.slice(0, 2).map(s => `<i style="background:${typeColor(s.type)}"></i>`).join('');
    else if (plan && d >= t) mk = `<i class="plan"></i>`;
    else if (plan && d < t && d >= firstLogDate()) mk = `<i class="miss"></i>`;
    const cls = [inMonth ? '' : 'out', doneS.length ? 'done' : '', d === t ? 'today' : '', d === ui.cal.sel ? 'sel' : ''].join(' ');
    g += `<button class="cal-d ${cls}" style="--c:${typeColor(type)}" data-act="cal-sel" data-date="${d}" aria-label="${fmtLong(d)}"><span class="cal-n">${dparse(d).getDate()}</span><span class="cal-mk">${mk}</span></button>`;
  }
  const mStart = `${ui.cal.month}-01`, mEnd = `${ui.cal.month}-${pad(daysInMonth)}`;
  const mSess = S.sessions.filter(s => s.date >= mStart && s.date <= mEnd && counted(s));
  const byType = ty => mSess.filter(s => s.type === ty);
  let h = bigTitle('Training log', 'Calendar', settingsBtn());
  h += `<div class="card"><div class="cal-head"><h3>${MON_L[m - 1]} ${y}</h3><div class="cal-nav"><button class="icon-btn sm" data-act="cal-move" data-d="-1" aria-label="Previous month">${ic('chevL')}</button><button class="icon-btn sm" data-act="cal-today" aria-label="This month">${ic('target')}</button><button class="icon-btn sm" data-act="cal-move" data-d="1" aria-label="Next month">${ic('chevR')}</button></div></div>
    <div class="cal-grid">${g}</div>
    <div class="cal-legend"><span style="--c:var(--push)"><i></i>Push</span><span style="--c:var(--pull)"><i></i>Pull</span><span style="--c:var(--legs)"><i></i>Legs</span><span style="--c:var(--text-3)"><i style="background:transparent;box-shadow:inset 0 0 0 1.5px var(--text-3)"></i>Planned</span></div></div>`;
  h += `<div class="split3">${['push','pull','legs'].map(ty => `<div style="--c:${typeColor(ty)}"><i>${ic(dayIcon(ty))}</i><b>${byType(ty).length}</b><span>${TYPES[ty].label} · ${fmtVolShort(byType(ty).reduce((a, s) => a + sessionVol(s), 0))} lb</span></div>`).join('')}</div>`;
  // Selected day
  const sel = ui.cal.sel, selSess = sessionsOn(sel), pid = S.schedule[dow(sel)], plan = pid ? S.days[pid] : null;

    selSess.filter(s => s.id !== S.activeId).forEach(s => {
      h += `<div class="card"><div class="hist">${s.entries.filter(en => en.sets.some(x => x.done)).map(en => `<div class="hist-row" style="--c:${typeColor(s.type)}"><div class="row-main"><span class="row-t wrap" style="font-size:14.5px">${esc(en.name)}</span><div class="hist-sets" style="margin-top:6px">${setChips(en)}</div></div></div>`).join('') || '<p class="muted">No sets checked off.</p>'}</div></div>`;

  } else if (sel <= t) {
    h += `<div class="card"><div class="empty" style="padding:12px 8px">${ic(plan ? dayIcon(plan.type) : 'rest')}<div>${plan ? `${esc(plan.name)} was planned. Nothing logged.` : 'Rest day. Nothing logged.'}</div></div><button class="btn btn-ghost btn-block" data-act="choose-day" data-date="${sel}">${ic('plus')}Log a workout for this day</button></div>`;

let _firstLog = null;
function firstLogDate() { if (_firstLog) return _firstLog; const s = sortedSessions().find(counted); const c = dstr(new Date(S.created || Date.now())); return (_firstLog = s && s.date < c ? s.date : c); }

/* Workout tab root */

  const t = today(), pid = S.schedule[dow(t)];

      <div class="set-foot"><span>Exercise volume</span><b data-live="vol-${en.id}">${fmtVol(entryVol(en))} lb</b></div></div>`;
    if (doneMax > 0 && (e.weight == null || doneMax > e.weight)) h += `<div class="suggest">${ic('trophy')}<p><b>${fmtNum(doneMax)} lb${sfx(e.load)}</b> today. Make it your new working weight?</p><button data-act="accept-weight" data-ex="${e.id}" data-w="${doneMax}">Save</button></div>`;
    const idx = ss.entries.indexOf(en), nxt = ss.entries[idx + 1];
    const allDone = en.sets.length && en.sets.every(s => s.done);
    if (nxt) h += `<button class="btn ${allDone ? 'btn-c' : 'btn-ghost'} btn-block btn-lg" data-act="next-ex" data-sid="${ss.id}" data-eid="${nxt.id}" data-ex="${nxt.exId}">Next: ${esc(shortName(exOf(nxt.exId)?.name || nxt.name))}${ic('chevR')}</button>`;
    else if (ss.id === S.activeId) h += `<button class="btn ${allDone ? 'btn-primary' : 'btn-ghost'} btn-block btn-lg" data-act="finish" data-sid="${ss.id}">${ic('flag')}Finish workout</button>`;
  }
  // Notes
  h += `<div class="card"><div class="card-h"><div class="card-t">Machine notes</div>${ic('note', 'faint')}</div><div class="fields">
    <div class="field"><label for="seat-${e.id}">${ic('seat')}Seat / setup</label><input class="inp" id="seat-${e.id}" data-in="ex-seat" data-ex="${e.id}" value="${esc(e.seat)}" placeholder="e.g. Seat peg 4, back pad 2"></div>
    <div class="field"><label for="notes-${e.id}">${ic('note')}Notes</label><textarea class="ta" id="notes-${e.id}" data-in="ex-notes" data-ex="${e.id}" placeholder="${e.pegs ? 'Peg setup, grip, cues…' : 'Grip, range of motion, cues…'}">${esc(e.notes)}</textarea></div>
    ${e.pegs ? `<p class="card-s">${PEG_HINT}</p>` : ''}</div></div>`;
  // History
  const past = hist.filter(p => !p.active).slice(-6).reverse();
  if (past.length) h += `<div class="sec"><h2>History</h2></div><div class="card"><div class="hist">${past.map(p => { const dd = dparse(p.date); return `<div class="hist-row" style="--c:${typeColor(p.type)}"><div class="hist-d"><b>${dd.getDate()}</b><span>${MON[dd.getMonth()]}</span></div><div class="hist-sets">${setChips({sets: p.sets})}</div><div class="hist-v">${fmtVolShort(p.vol)} lb</div></div>`; }).join('')}</div></div>`;
  h += `</div>`;
  return h;
};

/* Progress */
VIEWS.progress = () => {
  let h = bigTitle('Your numbers', 'Progress', settingsBtn());
  const t = today(), ws = weekStart(t), weeks = [];
  for (let i = 7; i >= 0; i--) {
    const a = addDays(ws, -7 * i), b = addDays(a, 6), w = {start: a, push: 0, pull: 0, legs: 0, total: 0, current: i === 0};
    S.sessions.filter(s => s.date >= a && s.date <= b).forEach(s => { const v = sessionVol(s); if (w[s.type] != null) w[s.type] += v; w.total += v; });
    weeks.push(w);
  }
  const anyVol = weeks.some(w => w.total > 0);
  h += `<div class="card"><div class="card-h"><div><div class="card-t">Weekly volume</div><div class="card-s">Last 8 weeks · sets × reps × weight</div></div></div>${anyVol ? barChart(weeks) : `<div class="ch-empty">${ic('volume')}<div>Finish a workout to see your weekly volume.</div>${META.demo ? '' : '<button data-act="demo-on">Preview with sample history</button>'}</div>`}<div class="legend" style="margin-top:10px"><span style="--c:var(--push)"><i></i>Push</span><span style="--c:var(--pull)"><i></i>Pull</span><span style="--c:var(--legs)"><i></i>Legs</span></div></div>`;
  const all = S.sessions.filter(counted);
  const totalVol = all.reduce((a, s) => a + sessionVol(s), 0);
  let totalSets = 0; all.forEach(s => s.entries.forEach(en => totalSets += en.sets.filter(validSet).length));
  h += `<div class="stats">${stat('dumbbell', 'var(--brand)', all.length, '', 'Workouts logged')}${stat('volume', 'var(--pull)', fmtVolShort(totalVol), 'lb', 'All-time volume')}</div>`;
  ['push','pull','legs'].forEach(ty => {
    const ids = [];
    DAY_ORDER.concat(Object.keys(S.days)).forEach(id => { const d = S.days[id]; if (d && d.type === ty) d.items.forEach(it => { if (!ids.includes(it.exId)) ids.push(it.exId); }); });
    Object.values(S.exercises).forEach(e => { if (!ids.includes(e.id) && exType(e.id) === ty && exHistory(e.id).length) ids.push(e.id); });
    if (!ids.length) return;
    h += `<div class="sec"><h2>${TYPES[ty].label}</h2></div><div class="list">${ids.map(id => {
      const e = exOf(id); if (!e) return '';
      const hh = exHistory(id), vals = hh.map(p => p.top).slice(-12);
      const ch = hh.length > 1 ? hh[hh.length - 1].top - hh[0].top : 0;
      return `<button class="prog-row" data-act="open-ex" data-ex="${id}"><span class="row-main"><span class="row-t">${esc(e.name)}</span><span class="row-s">${hh.length ? plural(hh.length, 'session') : 'No sessions yet'}</span></span>${spark(vals, typeColor(ty))}<span class="prog-v"><b>${e.weight == null ? '—' : fmtNum(e.weight)}<span class="faint" style="font-size:11px;font-weight:650"> lb${sfx(e.load)}</span></b>${ch ? `<span class="delta ${ch > 0 ? 'up' : 'down'}">${ch > 0 ? '+' : ''}${fmtNum(ch)} lb</span>` : ''}</span></button>`;
    }).join('')}</div>`;
  });
  return h;
};

/* ---------- Rest timer ---------- */
function startRest() { const sec = +S.settings.rest || 0; if (!sec) return; ui.rest = {end: Date.now() + sec * 1000, total: sec * 1000, over: false}; renderRest(); }
function renderRest() {
  const el = $('#restbar');
  if (!ui.rest || !S.activeId) { el.hidden = true; return; }
  const left = ui.rest.end - Date.now();
  if (left <= 0 && !ui.rest.over) { ui.rest.over = true; try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {} setTimeout(() => { if (ui.rest && ui.rest.over) { ui.rest = null; renderRest(); } }, 4000); }
  el.hidden = false;
  el.className = ui.rest.over ? 'over' : '';
  el.innerHTML = ui.rest.over ? `${ic('bolt')}<div class="rb-main"><div class="rb-top"><span class="rb-time" style="font-size:15px">Rest’s up. Next set.</span></div></div><button class="rb-btn" data-act="rest-skip">Close</button>`
    : `${ic('timer')}<div class="rb-main"><div class="rb-top"><span>Rest</span><span class="rb-time">${fmtClock(left + 999)}</span></div><div class="rb-bar"><b style="width:${clamp(left / ui.rest.total * 100, 0, 100)}%"></b></div></div><button class="rb-btn" data-act="rest-add">+15s</button><button class="rb-btn" data-act="rest-skip">Skip</button>`;
}
setInterval(() => {
  $$('[data-elapsed]').forEach(el => { el.textContent = fmtClock(Date.now() - +el.dataset.elapsed); });
  $$('[data-elapsed-m]').forEach(el => { el.textContent = mins(Date.now() - +el.dataset.elapsedM); });
  if (ui.rest) {
    if (ui.rest.over) return;
    const left = ui.rest.end - Date.now();
    const t = $('#restbar .rb-time'), b = $('#restbar .rb-bar b');
    if (left <= 0) renderRest();
    else { if (t) t.textContent = fmtClock(left + 999); if (b) b.style.width = clamp(left / ui.rest.total * 100, 0, 100) + '%'; }
  }
}, 1000);

function pickerList(list, cur, rowFor, q) {
  let out = `<div class="list"><button class="row" data-act="new-ex" data-mode="picker" style="--c:var(--brand)"><span class="row-ic">${ic('plus')}</span><span class="row-main"><span class="row-t">Create a new exercise</span><span class="row-s">For a machine that isn’t in your list</span></span></button></div>`;
  if (cur && !q) {
    const sugg = list.filter(e => e.id !== cur.id && e.muscle === cur.muscle);
    if (sugg.length) out += `<div class="grp-t">Same muscle · ${esc(cur.muscle)}</div><div class="list">${sugg.map(rowFor).join('')}</div>`;
  }

}
SHEETS.newEx = s => {

SHEETS.finish = s => {
  const ss = sessionById(s.sid), {done, total} = sessionSets(ss), vol = sessionVol(ss), c = typeColor(ss.type);
  const prevSame = sortedSessions().filter(x => x.dayId === ss.dayId && x.id !== ss.id && counted(x) && x.date <= ss.date).pop();
  const pv = prevSame ? sessionVol(prevSame) : 0;
  const ups = ss.entries.map(en => { const e = exOf(en.exId); const mx = Math.max(0, ...en.sets.filter(x => validSet(x) && x.t !== 'drop').map(x => +x.w)); return e && mx > 0 && (e.weight == null || mx > e.weight) ? {e, mx} : null; }).filter(Boolean);
  const prs = ss.entries.map(en => { const b = bestBefore(en.exId, ss.id); const mx = Math.max(0, ...en.sets.filter(x => validSet(x) && x.t !== 'drop').map(x => +x.w)); return b != null && mx > b ? en.name : null; }).filter(Boolean);
  if (!s.ups) s.ups = Object.fromEntries(ups.map(u => [u.e.id, true]));

};

/* ---------- Actions ---------- */
function getEntry(sid, eid) { const ss = sessionById(sid); const en = ss && ss.entries.find(x => x.id === eid); return {ss, en}; }
function makeEntry(exId, sets, reps, extra = {}) {
  const e = exOf(exId);
  return Object.assign({id: uid(), exId, name: e.name, target: {sets, reps}, sets: Array.from({length: sets}, () => ({w: e.weight ?? '', r: reps, done: false, t: 'work'}))}, extra);
}
function defaultsFor(exId) { for (const d of Object.values(S.days)) { const it = d.items.find(i => i.exId === exId); if (it) return [it.sets, it.reps]; } return [4, 8]; }
function startSession(dayId, date) {
  const d = S.days[dayId]; if (!d) return;
  const t = today(), past = date && date < t;
  if (!past && S.activeId) { closeSheet(); ui.stacks.workout = []; ui.tab = 'workout'; render({top: true}); toast('Finish this workout first', 'info'); return; }
  const start = past ? dparse(date).getTime() + 17 * 3600e3 : Date.now();
  const ss = {id: uid(), date: date || t, dayId, name: d.name, type: d.type, start, end: past ? start : null, entries: d.items.filter(it => exOf(it.exId)).map(it => makeEntry(it.exId, it.sets, it.reps))};
  S.sessions.push(ss);
  if (!past) S.activeId = ss.id;
  save(); closeSheet();
  if (past) { ui.tab = 'calendar'; ui.stacks.calendar = [{type: 'session', sid: ss.id}]; render({top: true, anim: true}); toast(`${d.name} added to ${fmtMD(date)}`); }
  else { ui.tab = 'workout'; ui.stacks.workout = []; render({top: true, anim: true}); toast(`${d.name} started`, 'play'); }
}
function applyWeight(e, w, pegs, load) {
  const old = e.weight;
  e.weight = w === '' || w == null || isNaN(w) ? null : +w;
  if (pegs !== undefined) e.pegs = pegs;
  if (load) e.load = load;
  e.hint = e.weight != null && SEED_HINTS[e.id] && SEED_HINTS[e.id].includes('"?"') ? null : e.hint;
  const act = activeSession();
  if (act && e.weight != null) act.entries.forEach(en => { if (en.exId === e.id) en.sets.forEach(s => { if (!s.done && s.t !== 'drop' && (s.w === '' || +s.w === +old)) s.w = e.weight; }); });
  save();
}
function updateRouteEx(eid, exId) { Object.values(ui.stacks).forEach(st => st.forEach(r => { if (r.type === 'exercise' && r.eid === eid) r.exId = exId; })); }
function doPick(exId, ctx) {
  const ss = ctx.sid ? sessionById(ctx.sid) : null;
  if (ctx.mode === 'swap' && ss) {
    const en = ss.entries.find(x => x.id === ctx.eid); if (!en) return;
    const old = en.exId; if (old === exId) { closeSheet(); return; }
    const e = exOf(exId), n = Math.max(en.target.sets, en.sets.filter(s => s.t !== 'drop').length);
    en.swappedFrom = en.swappedFrom || old; en.exId = exId; en.name = e.name;
    en.sets = Array.from({length: n}, () => ({w: e.weight ?? '', r: en.target.reps, done: false, t: 'work'}));
    if (ctx.also && S.days[ss.dayId]) S.days[ss.dayId].items.forEach(it => { if (it.exId === old) it.exId = exId; });
    updateRouteEx(en.id, exId);
    save(); closeSheet(); render(); toast(`Swapped in ${shortName(e.name)}`, 'swap');
  } else if (ctx.mode === 'add' && ss) {
    const [sets, reps] = defaultsFor(exId);
    ss.entries.push(makeEntry(exId, sets, reps, {added: true}));
    if (ctx.also && S.days[ss.dayId]) S.days[ss.dayId].items.push({id: uid(), exId, sets, reps});
    save(); closeSheet(); render(); toast(`Added ${shortName(exOf(exId).name)}`, 'plus');
  } else if (ctx.mode === 'prog-add') {
    const d = S.days[ctx.dayId]; if (!d) return;
    const [sets, reps] = defaultsFor(exId);
    d.items.push({id: uid(), exId, sets, reps});
    save(); closeSheet(); render(); toast(`Added to ${d.name}`, 'plus');
  }
}
let pendingConfirm = null;
function confirmSheet(title, text, yes, fn, danger = true) { pendingConfirm = fn; openSheet({type: 'confirm', title, text, yes, danger}); }
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  const m = document.querySelector('meta[name="theme-color"]:not([media])');
  if (m) m.setAttribute('content', getComputedStyle(document.body).backgroundColor);
}
function switchData(demo) {
  flush(); META.demo = demo; saveMeta(); S = loadState(); ui.stacks = {today: [], calendar: [], workout: [], program: [], progress: []}; ui.rest = null; closeSheet(); applyTheme(); render({top: true});
  toast(demo ? 'Showing sample history' : 'Back to your log', demo ? 'sparkle' : 'check');
}

const A = {
  tab: d => { if (ui.sheet) closeSheet(); goTab(d.tab); },
  back: () => popRoute(),
  'open-ex': d => pushRoute({type: 'exercise', exId: d.ex, sid: d.sid || null, eid: d.eid || null}),
  'next-ex': d => { ui.stacks[ui.tab].pop(); pushRoute({type: 'exercise', exId: d.ex, sid: d.sid, eid: d.eid}); },
  'open-day': d => { ui.editDay = null; pushRoute({type: 'day', dayId: d.day}); },
  'open-library': () => pushRoute({type: 'library'}),
  'open-session': d => { if (d.sid === S.activeId) { goTab('workout'); return; } pushRoute({type: 'session', sid: d.sid}); },
  start: d => startSession(d.day, d.date),
  'choose-day': d => openSheet({type: 'chooseDay', date: d.date || null}),
  'cal-jump': d => { ui.cal.sel = d.date; ui.cal.month = d.date.slice(0, 7); ui.tab = 'calendar'; ui.stacks.calendar = []; render({top: true}); },

  'cal-move': d => { const [y, m] = ui.cal.month.split('-').map(Number); const nd = new Date(y, m - 1 + +d.d, 1); ui.cal.month = dstr(nd).slice(0, 7); render(); },
  'cal-today': () => { ui.cal.month = today().slice(0, 7); ui.cal.sel = today(); render(); },
  'set-done': d => {
    const {ss, en} = getEntry(d.sid, d.eid); if (!en) return;
    const s = en.sets[+d.i];
    if (!s.done && (!(+s.w > 0) || !(+s.r > 0))) { toast('Enter weight and reps first', 'info'); const inp = $(`#${!(+s.w > 0) ? 'w' : 'r'}-${en.id}-${d.i}`); if (inp) inp.focus(); return; }
    s.done = !s.done; s.at = s.done ? Date.now() : null;
    save();
    if (s.done && ss.id === S.activeId) startRest();
    render();
  },
  'add-set': d => { const {en} = getEntry(d.sid, d.eid); if (!en) return; const e = exOf(en.exId); const last = en.sets.filter(s => s.t !== 'drop').slice(-1)[0] || en.sets.slice(-1)[0]; en.sets.push({w: last ? last.w : (e?.weight ?? ''), r: last ? last.r : en.target.reps, done: false, t: 'extra'}); save(); render(); toast('Added 1 additional set', 'plus'); },
  'add-drop': d => { const {en} = getEntry(d.sid, d.eid); if (!en) return; const e = exOf(en.exId); const last = en.sets.slice(-1)[0]; const base = +(last && last.w) || +(e && e.weight) || 0; en.sets.push({w: base ? Math.max(S.settings.step, roundTo(base * 0.75, S.settings.step)) : '', r: last ? last.r : en.target.reps, done: false, t: 'drop'}); save(); render(); toast('Drop set added at about 75%', 'drop'); },
  'set-menu': d => openSheet({type: 'setMenu', sid: d.sid, eid: d.eid, i: +d.i}),
  'set-type': d => { const s = ui.sheet; const {en} = getEntry(s.sid, s.eid); if (en && en.sets[s.i]) { en.sets[s.i].t = d.t; save(); } closeSheet(); render(); },
  'set-dup': () => { const s = ui.sheet; const {en} = getEntry(s.sid, s.eid); if (en && en.sets[s.i]) { const o = en.sets[s.i]; en.sets.splice(s.i + 1, 0, {w: o.w, r: o.r, done: false, t: o.t === 'work' ? 'extra' : o.t}); save(); } closeSheet(); render(); },
  'set-del': () => { const s = ui.sheet; const {en} = getEntry(s.sid, s.eid); if (en) { en.sets.splice(s.i, 1); save(); } closeSheet(); render(); toast('Set removed', 'trash'); },
  swap: d => openSheet({type: 'picker', mode: 'swap', sid: d.sid, eid: d.eid, q: '', also: false}),
  'add-ex': d => { const ss = sessionById(d.sid); openSheet({type: 'picker', mode: 'add', sid: d.sid, dayId: ss && ss.dayId, q: '', also: false}); },
  'prog-add': d => openSheet({type: 'picker', mode: 'prog-add', dayId: d.day, q: ''}),
  'picker-also': () => { ui.sheet.also = !ui.sheet.also; rerenderSheetBody(); },
  'pick-ex': d => doPick(d.ex, ui.sheet),
  'new-ex': d => { const after = d.mode === 'picker' && ui.sheet ? Object.assign({}, ui.sheet) : null; let muscle = 'Chest'; if (after && after.eid) { const en = getEntry(after.sid, after.eid).en; if (en && exOf(en.exId)) muscle = exOf(en.exId).muscle; } openSheet({type: 'newEx', after, form: {name: after && after.q ? after.q : '', muscle, load: 'total', weight: '', sets: 4, reps: 8}}); },
  'nx-load': d => { ui.sheet.form.load = d.v; rerenderSheetBody(); },
  'nx-save': () => {
    const s = ui.sheet, f = s.form, name = (f.name || '').trim();
    if (!name) { toast('Give the exercise a name', 'info'); $('#nx-name')?.focus(); return; }
    let id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'exercise';
    if (S.exercises[id]) id += '-' + uid().slice(0, 4);
    S.exercises[id] = {id, name, muscle: f.muscle, load: f.load, weight: f.weight === '' || f.weight == null ? null : +f.weight, pegs: null, seat: '', notes: '', hint: null, custom: true};
    save();
    if (s.after) {
      const ctx = s.after;
      if (ctx.mode === 'swap') doPick(id, ctx);
      else { const sets = clamp(+f.sets || 4, 1, 12), reps = clamp(+f.reps || 8, 1, 50); const ss = ctx.sid ? sessionById(ctx.sid) : null;
        if (ctx.mode === 'add' && ss) { ss.entries.push(makeEntry(id, sets, reps, {added: true})); if (ctx.also && S.days[ss.dayId]) S.days[ss.dayId].items.push({id: uid(), exId: id, sets, reps}); }
        else if (ctx.mode === 'prog-add' && S.days[ctx.dayId]) S.days[ctx.dayId].items.push({id: uid(), exId: id, sets, reps});
        save(); closeSheet(); render(); toast(`Added ${shortName(name)}`, 'plus'); }
    } else { closeSheet(); render(); toast('Exercise created', 'plus'); }
  },
  'edit-weight': d => { const e = exOf(d.ex); openSheet({type: 'weight', exId: e.id, form: {weight: e.weight, pegs: e.pegs ? e.pegs.slice() : null, load: e.load}}); },
  'w-step': d => { const f = ui.sheet.form, st = +S.settings.step || 5; if (f.pegs) { let k = 0; f.pegs.forEach((v, i) => { if (+v > 0) k = i; }); f.pegs[k] = Math.max(0, (+f.pegs[k] || 0) + st * +d.d); } else f.weight = Math.max(0, (+f.weight || 0) + st * +d.d); rerenderSheetBody(); },
  'w-load': d => { ui.sheet.form.load = d.v; rerenderSheetBody(); },
  'w-pegs': () => { const f = ui.sheet.form; if (f.pegs) { f.weight = f.pegs.reduce((a, b) => a + (+b || 0), 0); f.pegs = null; } else f.pegs = [+f.weight || 0, 0, 0]; rerenderSheetBody(); },
  'w-save': () => { const s = ui.sheet, e = exOf(s.exId), f = s.form; const pegs = f.pegs ? f.pegs.map(v => +v || 0) : null; const w = pegs ? pegs.reduce((a, b) => a + b, 0) : f.weight; applyWeight(e, w, pegs, f.load); closeSheet(); render(); toast('Working weight saved'); },
  'accept-weight': d => { const e = exOf(d.ex); if (e.pegs) { openSheet({type: 'weight', exId: e.id, form: {weight: +d.w, pegs: e.pegs.slice(), load: e.load}}); toast('Set your pegs to match', 'info'); return; } applyWeight(e, +d.w); render(); toast(`Working weight is now ${fmtNum(d.w)} lb`, 'trophy'); },
  'hint-ok': d => { const e = exOf(d.ex); if (e) { e.hint = null; save(); render(); } },
  'chart-mode': d => { ui.chartMode = d.mode; render(); },
  finish: d => openSheet({type: 'finish', sid: d.sid}),
  'fin-up': d => { ui.sheet.ups[d.ex] = !ui.sheet.ups[d.ex]; rerenderSheetBody(); },
  'fin-save': () => {
    const s = ui.sheet, ss = sessionById(s.sid); if (!ss) return;
    Object.entries(s.ups || {}).forEach(([id, on]) => { if (!on) return; const e = exOf(id); const mx = Math.max(0, ...ss.entries.filter(en => en.exId === id).flatMap(en => en.sets.filter(x => validSet(x) && x.t !== 'drop').map(x => +x.w))); if (e && mx) { if (e.pegs) { const diff = mx - (+e.weight || 0); let k = -1; e.pegs.forEach((v, i) => { if (+v > 0) k = i; }); e.pegs[k < 0 ? 0 : k] = (+e.pegs[k < 0 ? 0 : k] || 0) + diff; } e.weight = mx; e.hint = null; } });
    ss.end = Date.now(); if (S.activeId === ss.id) S.activeId = null; ui.rest = null;
    save(); closeSheet(); ui.stacks.workout = []; ui.tab = 'today'; ui.stacks.today = []; render({top: true}); toast(`${ss.name} saved · ${fmtVol(sessionVol(ss))} lb`, 'trophy');
  },
  'session-menu': d => openSheet({type: 'sessionMenu', sid: d.sid}),
  discard: d => { const ss = sessionById(d.sid); const active = ss && ss.id === S.activeId; confirmSheet(active ? 'Discard workout?' : 'Delete workout?', active ? 'Everything you logged in this workout will be removed.' : `This removes ${esc(ss.name)} on ${fmtMD(ss.date)} from your log.`, active ? 'Discard' : 'Delete', () => { S.sessions = S.sessions.filter(x => x.id !== d.sid); if (S.activeId === d.sid) { S.activeId = null; ui.rest = null; } save(); Object.keys(ui.stacks).forEach(k => { ui.stacks[k] = ui.stacks[k].filter(r => r.sid !== d.sid); }); render({top: true}); toast(active ? 'Workout discarded' : 'Workout deleted', 'trash'); }); },
  'confirm-yes': () => { const fn = pendingConfirm; pendingConfirm = null; closeSheet(); fn && fn(); },
  'sheet-close': () => closeSheet(),
  'day-edit': d => { ui.editDay = ui.editDay === d.day ? null : d.day; render(); },
  'item-step': d => { const it = S.days[d.day].items.find(i => i.id === d.item); if (!it) return; it[d.f] = clamp(it[d.f] + +d.d, 1, d.f === 'sets' ? 12 : 50); save(); render(); },
  'item-move': d => { const items = S.days[d.day].items, i = items.findIndex(x => x.id === d.item), j = i + +d.d; if (i < 0 || j < 0 || j >= items.length) return; [items[i], items[j]] = [items[j], items[i]]; save(); render(); },
  'item-del': d => { const day = S.days[d.day], it = day.items.find(x => x.id === d.item); confirmSheet('Remove exercise?', `Take ${esc(exOf(it.exId)?.name || 'this exercise')} out of ${esc(day.name)}? Its history and notes stay in your library.`, 'Remove', () => { day.items = day.items.filter(x => x.id !== d.item); save(); render(); }); },
  'sched-edit': d => openSheet({type: 'sched', dow: +d.dow}),
  'sched-set': d => { S.schedule[ui.sheet.dow] = d.day || null; save(); closeSheet(); render(); },
  settings: () => openSheet({type: 'settings'}),
  'set-rest': d => { S.settings.rest = +d.v; save(); rerenderSheetBody(); },
  'set-step': d => { S.settings.step = +d.v; save(); rerenderSheetBody(); },
  'toggle-sides': () => { S.settings.countSides = !S.settings.countSides; save(); rerenderSheetBody(); render(); },
  'set-theme': d => { S.settings.theme = d.v; save(); applyTheme(); rerenderSheetBody(); },
  'demo-on': () => switchData(true),
  'demo-off': () => switchData(false),
  backup: () => openSheet({type: 'backup'}),
  'backup-copy': () => { const t = $('#backup-text'); const v = t ? t.value : ''; const fallback = () => { if (t) { t.focus(); t.select(); } toast('Select all and copy', 'copy'); }; try { navigator.clipboard.writeText(v).then(() => toast('Backup copied', 'copy'), fallback); } catch (e) { fallback(); } },
  'backup-share': async () => {
    const json = $('#backup-text').value, name = `physique-backup-${today()}.json`;
    try { const file = new File([json], name, {type: 'application/json'}); if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: 'Physique backup'}); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    if (inFrame) { A['backup-copy'](); return; }
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], {type: 'application/json'})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Backup file saved', 'download'); } catch (e) { A['backup-copy'](); }
  },
  restore: () => openSheet({type: 'restore', text: ''}),
  'restore-go': () => {
    const txt = ($('#restore-text') || {}).value || ui.sheet.text || '';
    let data; try { data = JSON.parse(txt); } catch (e) { toast('That doesn’t look like a backup', 'alert'); return; }
    if (!data || !data.exercises || !data.days || !Array.isArray(data.sessions)) { toast('That doesn’t look like a backup', 'alert'); return; }
    confirmSheet('Replace data on this phone?', `Restore ${plural(data.sessions.length, 'workout')} from the backup. What’s here now will be replaced.`, 'Restore', () => { delete data.app; delete data.exported; S = migrate(data); flush(); ui.stacks = {today: [], calendar: [], workout: [], program: [], progress: []}; applyTheme(); render({top: true}); toast('Backup restored'); });
  },
  reset: () => confirmSheet('Reset everything?', 'This deletes every logged workout and note on this phone and reloads the program from your doc. Back up first if you might want it.', 'Reset', () => { S = defaultState(); flush(); ui.stacks = {today: [], calendar: [], workout: [], program: [], progress: []}; ui.rest = null; ui.tab = 'today'; applyTheme(); render({top: true}); toast('Reset done'); }),
  'install-help': () => openSheet({type: 'install'}),
  'dismiss-install': () => { META.installDismissed = true; saveMeta(); render(); },
  'rest-add': () => { if (ui.rest) { ui.rest.end += 15000; ui.rest.total += 15000; renderRest(); } },
  'rest-skip': () => { ui.rest = null; renderRest(); }
};
const INPUTS = {
  'set-w': t => { const {en} = getEntry(t.dataset.sid, t.dataset.eid); if (!en) return; en.sets[+t.dataset.i].w = t.value === '' ? '' : +t.value; save(); liveVol(en); },
  'set-r': t => { const {en} = getEntry(t.dataset.sid, t.dataset.eid); if (!en) return; en.sets[+t.dataset.i].r = t.value === '' ? '' : Math.round(+t.value); save(); liveVol(en); },
  'ex-seat': t => { const e = exOf(t.dataset.ex); if (e) { e.seat = t.value; save(); } },
  'ex-notes': t => { const e = exOf(t.dataset.ex); if (e) { e.notes = t.value; save(); } },
  'picker-q': t => { ui.sheet.q = t.value; const s = ui.sheet; const ss = s.sid ? sessionById(s.sid) : null, en = ss && s.eid ? ss.entries.find(x => x.id === s.eid) : null; const cur = en ? exOf(en.exId) : null; const q = t.value.trim().toLowerCase(); const inSession = ss ? new Set(ss.entries.map(x => x.exId)) : new Set((S.days[s.dayId]?.items || []).map(i => i.exId)); const list = Object.values(S.exercises).filter(e => !q || e.name.toLowerCase().includes(q) || e.muscle.toLowerCase().includes(q)); const rowFor = e => `<button class="row" data-act="pick-ex" data-ex="${e.id}" style="--c:${typeColor(exType(e.id))}"><span class="row-ic">${ic(dayIcon(exType(e.id)))}</span><span class="row-main"><span class="row-t">${esc(e.name)}</span><span class="row-s">${esc(e.muscle)} · ${fmtW(e.weight, e.load)}</span></span><span class="row-end">${inSession.has(e.id) ? '<span class="tag">In workout</span>' : ic('plus')}</span></button>`; $('#picker-list').innerHTML = pickerList(list, cur, rowFor, q); },
  nx: t => { ui.sheet.form[t.dataset.f] = t.value; },
  'w-total': t => { ui.sheet.form.weight = t.value === '' ? '' : +t.value; },
  'w-peg': t => { const f = ui.sheet.form; f.pegs[+t.dataset.i] = t.value === '' ? 0 : +t.value; const tot = $('#w-total'); if (tot) tot.value = f.pegs.reduce((a, b) => a + (+b || 0), 0); },
  'set-name': t => { S.settings.name = t.value; save(); },
  'restore-text': t => { ui.sheet.text = t.value; },
  'restore-file': t => { const f = t.files && t.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { ui.sheet.text = String(rd.result || ''); const ta = $('#restore-text'); if (ta) ta.value = ui.sheet.text; toast('Backup loaded. Tap Restore.', 'upload'); }; rd.readAsText(f); }
};
function liveVol(en) { const el = $(`[data-live="vol-${en.id}"]`); if (el) el.textContent = fmtVol(entryVol(en)) + ' lb'; }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = A[t.dataset.act]; if (!fn) return;
  e.preventDefault();
  fn(t.dataset, t, e);
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.in; if (k && INPUTS[k]) INPUTS[k](e.target, e); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.in; if ((k === 'restore-file' || k === 'nx') && INPUTS[k]) INPUTS[k](e.target, e); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches && e.target.matches('.set input')) e.target.blur(); if (e.key === 'Escape' && ui.sheet) closeSheet(); });
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('.set input')) setTimeout(() => { try { e.target.select(); } catch (x) {} }, 0); });
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { const y = window.scrollY; render(); window.scrollTo(0, y); }, 200); });
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {} }

applyTheme();
render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && !inFrame && location.protocol === 'https:') { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
window.__physique = {get state() { return S; }, ui, render};
})();
</script>
